apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-target-storefront
  namespace: aegis-target
  labels:
    app: aegis-storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-storefront
  template:
    metadata:
      labels:
        app: aegis-storefront
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: storefront
          image: aegis-target-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: target-storefront-svc
  namespace: aegis-target
  labels:
    app: aegis-storefront
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: aegis-storefront
