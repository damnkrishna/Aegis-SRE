# Falco Configuration for Aegis Test Environment

rules_files:
  - /etc/falco/falco_rules.local.yaml

engine:
  kind: modern_ebpf

json_output: true
json_include_output_property: true
json_include_tags_property: true

log_stderr: true
log_syslog: false
log_level: info

stdout_output:
  enabled: true

file_output:
  enabled: false

syslog_output:
  enabled: false

webserver:
  enabled: false
