- rule: Aegis Shell Spawned in Container
  desc: Detect shell execution (sh, bash, zsh) inside target microservice container
  condition: >
    spawned_process and
    container and
    proc.name in (sh, bash, zsh, ksh)
  output: "Aegis Security Alert: Shell spawned in container (user=%user.name container_id=%container.id container_name=%container.name cmd=%proc.cmdline gparent=%proc.aname[2])"
  priority: WARNING
  tags: [mitre_execution, T1059, aegis_security]

- rule: Aegis Sensitive File Read Access
  desc: Detect unauthorized access to sensitive credential files inside container
  condition: >
    open_read and
    container and
    (fd.name startswith /etc/shadow or fd.name startswith /root/.ssh or fd.name startswith /var/run/secrets)
  output: "Aegis Security Alert: Sensitive file opened for reading (user=%user.name file=%fd.name container_name=%container.name cmd=%proc.cmdline)"
  priority: ERROR
  tags: [mitre_credential_access, T1552, aegis_security]
